<!doctype html>
<html lang="en" class="scroll-smooth antialiased">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="icon" href="%sveltekit.assets%/oldfavicon.svg" />
  <meta name="application-name" content="Nick's Blogs & Adventures" />
  <meta name="theme-color" content="#0ea5e9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <link rel="preconnect" href="https://cdn.nickesselman.nl" crossorigin />
  <link
    rel="preload"
    href="%sveltekit.assets%/fonts/space-grotesk-latin.woff2"
    as="font"
    type="font/woff2"
    crossorigin
  />

  %sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover">
  <div style="display: contents">%sveltekit.body%</div>
</body>

</html>
